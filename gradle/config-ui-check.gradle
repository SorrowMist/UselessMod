// Isolated client checks; no test classes or optional GUI mod enter the release JAR.
if (!providers.gradleProperty('configUiCheck').isPresent()) return

sourceSets {
    configUiCheck {
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
    }
}
dependencies {
    modRuntimeOnly 'maven.modrinth:XxWD5pD3:jYgSnxye'
    modRuntimeOnly 'maven.modrinth:Ck4E7v7R:i7Tp1AHw'
    modRuntimeOnly 'io.github.llamalad7:mixinextras-forge:0.5.0'
    if (!providers.gradleProperty('configUiWithoutConfigured').isPresent()) {
        modRuntimeOnly 'curse.maven:configured-457570:5180900'
    }
}
legacyForge {
    mods { "${mod_id}" { sourceSet sourceSets.configUiCheck } }
    runs {
        configUiCheck {
            client()
            gameDirectory = file('run/config-ui-check')
            systemProperty 'useless.configUiCheck', 'true'
            systemProperty 'useless.configUiScreenshots', providers.gradleProperty('configUiScreenshots')
                    .getOrElse(file('run/config-ui-check/screenshots').absolutePath)
        }
    }
}
