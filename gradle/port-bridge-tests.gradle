// Compatibility regression tests for the Forge 1.20.1 bridges.
// This source set is deliberately NOT packaged in the release jar.
sourceSets {
    portBridge {
        java.srcDir 'src/main/java'
        java.include 'com/sorrowmist/useless/compat/forge1201/**'
        java.include 'com/sorrowmist/useless/utils/RateLimitedLogger.java'
        java.include 'com/sorrowmist/useless/compat/kubejs/AdvancedAlloyFurnaceRecipeSchema.java'
        java.include 'com/sorrowmist/useless/compat/kubejs/GenericStackRecipeComponent.java'
        java.include 'com/sorrowmist/useless/compat/kubejs/NativeRecipeComponent.java'
        java.include 'com/sorrowmist/useless/content/recipe/adapters/exdeorum/**'
