mixin {
    add sourceSets.main, "${mod_id}.refmap.json"
    ["${mod_id}.mixins.json", "${mod_id}.create.mixins.json", "${mod_id}.mekanism.mixins.json", "${mod_id}.jade.mixins.json", "${mod_id}.thermal.mixins.json", "${mod_id}.compact.mixins.json"].each { config it }
}
tasks.named('jar') {
    manifest.attributes('MixinConfigs': ["${mod_id}.mixins.json", "${mod_id}.create.mixins.json", "${mod_id}.mekanism.mixins.json", "${mod_id}.jade.mixins.json", "${mod_id}.thermal.mixins.json", "${mod_id}.compact.mixins.json"].join(','))
}
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs += ['-Xmaxerrs', '10000']
}
tasks.named('test', Test) {
    useJUnitPlatform()
    classpath = classpath.filter { !it.name.startsWith('slf4j-api-1.') }
    classpath += files(layout.buildDirectory.file("moddev/artifacts/client-extra-${minecraft_version}-${forge_version}.jar"))
}
tasks.named('processResources', ProcessResources) {
    filteringCharset = 'UTF-8'
    inputs.property 'mod_version', mod_version
    filesMatching('META-INF/mods.toml') {
        expand mod_id: mod_id, mod_name: mod_name, mod_version: mod_version
    }
}

