        java.include 'com/sorrowmist/useless/compat/mekanism/NativeFurnaceChemicalHandlers.java'
        java.include 'com/sorrowmist/useless/content/machines/advanced_alloy_furnace/io/FurnaceFaceAccessor.java'
        java.include 'com/sorrowmist/useless/api/enums/FurnaceFace*.java'
        java.include 'com/sorrowmist/useless/content/recipe/adapters/ae/extendedae/**'
        java.exclude 'com/sorrowmist/useless/content/recipe/adapters/ae/extendedae/CrystalAssemblerRecipeAdapter.java'
        java.include 'com/sorrowmist/useless/content/recipe/adapters/ae/advancedae/**'
        java.include 'com/sorrowmist/useless/content/recipe/RecipeSourceIds.java'
        java.include 'com/sorrowmist/useless/content/recipe/AlloyFurnaceRecipeIdentity.java'
        java.include 'com/sorrowmist/useless/content/recipe/adapters/minecraft/BrewingSyntheticRecipe.java'
        java.include 'com/sorrowmist/useless/content/recipe/adapters/minecraft/BrewingRecipeAdapter.java'
        java.include 'com/sorrowmist/useless/api/recipe/IRecipeAdapter.java'
        java.include 'com/sorrowmist/useless/content/recipe/IRecipeAdapter.java'
        java.include 'com/sorrowmist/useless/content/blockentities/HighStackItemStackHandler.java'
        java.include 'com/sorrowmist/useless/api/enums/AlloyFurnaceMode.java'
        java.include 'com/sorrowmist/useless/content/recipe/AdvancedAlloyFurnaceRecipe.java'
        java.include 'com/sorrowmist/useless/content/recipe/AdvancedAlloyFurnaceRecipeSerializer.java'
        java.include 'com/sorrowmist/useless/content/recipe/AdvancedAlloyFurnaceRecipeBuilder.java'
        java.include 'com/sorrowmist/useless/content/recipe/CountedIngredient.java'
        java.include 'com/sorrowmist/useless/content/recipe/LongSizedFluidIngredient.java'
        java.include 'com/sorrowmist/useless/content/recipe/FluidIngredientAllocator.java'
        java.include 'com/sorrowmist/useless/content/recipe/ItemIngredientAllocator.java'
        java.include 'com/sorrowmist/useless/content/recipe/AlloyFurnaceRecipeFingerprint.java'
        java.include 'com/sorrowmist/useless/content/recipe/adapters/extendedcrafting/**'
        java.include 'com/sorrowmist/useless/content/recipe/adapters/enderio/NativeFireLootResults.java'
        java.include 'com/sorrowmist/useless/content/recipe/adapters/industrialforegoing/DissolutionChamberRecipeAdapter.java'
        java.include 'com/sorrowmist/useless/content/recipe/adapters/summoningrituals/SummoningRitualsAltarRecipeAdapter.java'
        java.include 'com/sorrowmist/useless/content/recipe/adapters/enderio/EnderIOAdapterUtils.java'
        java.include 'com/sorrowmist/useless/content/recipe/adapters/enderio/AlloySmeltingRecipeAdapter.java'
        java.include 'com/sorrowmist/useless/content/recipe/adapters/enderio/SlicingRecipeAdapter.java'
        java.include 'com/sorrowmist/useless/content/recipe/adapters/enderio/SagMillingRecipeAdapter.java'
        java.include 'com/sorrowmist/useless/content/recipe/adapters/enderio/EnchanterRecipeAdapter.java'
        java.include 'com/sorrowmist/useless/content/recipe/adapters/enderio/SoulVialSetIngredient.java'
        java.include 'com/sorrowmist/useless/content/machines/advanced_alloy_furnace/ae/PatternStackView.java'
        java.include 'com/sorrowmist/useless/content/machines/advanced_alloy_furnace/ae/DynamicComponentPattern.java'
        java.include 'com/sorrowmist/useless/content/machines/advanced_alloy_furnace/ae/DynamicComponentPatternDetails.java'
        java.include 'com/sorrowmist/useless/content/recipe/adapters/enderio/SoulBindingRecipeAdapter.java'
        java.include 'com/sorrowmist/useless/content/recipe/adapters/enderio/TankRecipeAdapter.java'
        java.include 'com/sorrowmist/useless/content/recipe/adapters/enderio/SoulVialRecipeAdapter.java'
        java.include 'com/sorrowmist/useless/content/recipe/adapters/apotheosis/ApotheosisGemIngredient.java'
        java.include 'com/sorrowmist/useless/content/recipe/adapters/hostilenetworks/DataModelRangeIngredient.java'
        java.include 'com/sorrowmist/useless/content/recipe/adapters/hostilenetworks/HostileNetworksRecipeAdapter.java'
        java.include 'com/sorrowmist/useless/content/recipe/adapters/hostilenetworks/HostileNetworksSyntheticRecipe.java'

        compileClasspath += sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.compileClasspath
    }
    portBridgeTest {
        java.srcDir 'src/portBridgeTest/java'
        compileClasspath += sourceSets.portBridge.output + sourceSets.portBridge.compileClasspath
        runtimeClasspath += sourceSets.portBridge.output + sourceSets.portBridge.runtimeClasspath
    }
}
configurations {
    portBridgeTestImplementation.extendsFrom testImplementation
    portBridgeTestRuntimeOnly.extendsFrom testRuntimeOnly
}
tasks.named('check') { dependsOn 'portBridgeTest' }

tasks.register('portBridgeTest', Test) {
    testClassesDirs = sourceSets.portBridgeTest.output.classesDirs
    classpath = sourceSets.portBridgeTest.runtimeClasspath
    useJUnitPlatform()
    maxHeapSize = '1G'
}

// ModDev's test logging adapter requires SLF4J 2; this does not affect runtime dependencies.
dependencies { portBridgeTestRuntimeOnly 'org.slf4j:slf4j-api:2.0.9' }
tasks.named('portBridgeTest', Test) { classpath = classpath.filter { !it.name.startsWith('slf4j-api-1.') } }

// Native bootstrap needs actual Minecraft resources; this jar is never packaged with the mods.
tasks.named('portBridgeTest', Test) {
    classpath += files(layout.buildDirectory.file("moddev/artifacts/client-extra-${minecraft_version}-${forge_version}.jar"))
}
