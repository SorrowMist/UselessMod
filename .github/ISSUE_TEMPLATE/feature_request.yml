name: Feature request / 功能请求
description: 提出新功能或改进建议。/ Suggest a new feature or an improvement.
title: "[Feature] "
labels: ["feat"]
body:
  - type: markdown
    attributes:
      value: |
        请在上方标题中概括你的建议。请先搜索现有 issue 与 Discussions，避免重复提出。
        本模板用于**功能建议**；使用疑问请走 Discussions，缺陷请用 Bug report。

  - type: checkboxes
    id: existing-issue
    attributes:
      label: 已检查现有建议 / Checked for existing suggestions
      options:
        - label: 我已搜索过现有 issue 与 Discussions，未发现相同建议。/ I have searched existing issues and discussions and found none.
          required: true

  - type: textarea
    id: problem
    attributes:
      label: 想解决的问题 / Problem to solve
      description: 说明当前的使用痛点或缺失的能力，而不是直接跳到实现方案。
      placeholder: "例如：批量处理时每条配方都要手动填一遍，效率很低。"
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 期望的方案 / Proposed solution
      description: 你希望模组提供什么功能？若涉及 KubeJS / 数据包 API，请给出期望的调用写法。
      placeholder: |
        例如：希望能这样调用——
        ```js
        // 期望的 API 示例
        ```
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案 / Alternatives considered
      description: 目前你用什么方式绕过？可选填。

  - type: textarea
    id: context
    attributes:
      label: 补充信息 / Additional context
      description: 涉及的具体模组联动、参考实现、截图或上游 issue 链接等。可选填。