// Real Forge lifecycle checks; test classes and runtime fixtures never enter the release jar.
if (!providers.gradleProperty('mergeGameTest').isPresent()) return

sourceSets {
    gameTest {
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
    }
}

dependencies {
    modRuntimeOnly 'maven.modrinth:QeB3NRC5:5muSI5qX'
    modRuntimeOnly 'curse.maven:ex-deorum-901420:6614784'
    modRuntimeOnly 'maven.modrinth:XxWD5pD3:jYgSnxye'
    modRuntimeOnly 'maven.modrinth:Ck4E7v7R:i7Tp1AHw'
    modRuntimeOnly 'curse.maven:cofh_core-69162:5374122'
    modRuntimeOnly 'com.teamcofh:thermal_core:1.20.1-11.0.7.25'
    modRuntimeOnly 'curse.maven:thermal_foundation-222880:5443583'
    modRuntimeOnly 'curse.maven:thermal_expansion-69163:5372749'
    modRuntimeOnly 'curse.maven:blood-magic-224791:7253333'
    modRuntimeOnly 'curse.maven:embers-rekindled-300777:7446478'
    modRuntimeOnly 'curse.maven:Patchouli-306770:6164575'
    modRuntimeOnly 'io.github.llamalad7:mixinextras-forge:0.5.0'
}

if (providers.gradleProperty('compatGameTest').isPresent()) {
    sourceSets.gameTest.java.srcDir 'src/compatGameTest/java'
    sourceSets.gameTest.resources.srcDir 'src/compatGameTest/resources'
    def stretcherRepo = providers.gradleProperty('stretcherRepo').get()
    repositories {
        flatDir { dirs "${stretcherRepo}/build/libs" }
    }
    dependencies {
        modRuntimeOnly 'maven.modrinth:rxYaglEe:d83Wdhdn'
        modRuntimeOnly 'curse.maven:applied-flux-965012:6755986'
        modRuntimeOnly 'maven.modrinth:UhW5uCKw:eoUaDkZf'
        modRuntimeOnly 'maven.modrinth:Ce6I4WUE:uxe1WQp4'
        modRuntimeOnly 'maven.modrinth:IiATswDj:9n9p68Qq'
        modRuntimeOnly 'maven.modrinth:qDJXZJTz:PQ3IlR98'
        modRuntimeOnly 'maven.modrinth:8BmcQJ2H:aVW7Z5da'
        modRuntimeOnly 'local.compat:useless_stretcher:20.1.6.0-compat.2'
        gameTestCompileOnly files("${stretcherRepo}/build/devlibs/useless_stretcher-20.1.6.0-compat.2.jar")
    }
    if (providers.gradleProperty('compatClientProbe').isPresent()) {
        repositories { flatDir { dirs providers.gradleProperty('packMods').get() } }
        dependencies {
            modRuntimeOnly 'maven.modrinth:u6dRKJwZ:TrKZlZ0b'
            modRuntimeOnly 'pack.fixture:exmachinis-deorum:1.20.1-3.0.3'
        }
        legacyForge.runs.client.systemProperty 'useless.compatClientProbe', 'true'
    }
}

legacyForge {
    mods { "${mod_id}" { sourceSet sourceSets.gameTest } }
    runs {
        gameTestServer {
            type = 'gameTestServer'
            gameDirectory = file('run/merge-gametest')
            systemProperty 'forge.enabledGameTestNamespaces', mod_id
        }
    }
}
