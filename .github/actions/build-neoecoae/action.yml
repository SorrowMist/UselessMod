name: Build NeoECOAE dependency
description: Build the matching NeoECOAE JAR for the Useless Mod compile classpath
runs:
  using: composite
  steps:
    - name: Checkout NeoECOAE
      uses: actions/checkout@v4
      with:
        repository: DancingSnow0517/NeoECOAEExtension
        ref: 075bc7ce129f0127e9557ce807b8033b247e009e
        path: .ci/NeoECOAEExtension
        persist-credentials: false

    - name: Build paired NeoECOAE JAR
      shell: bash
      working-directory: .ci/NeoECOAEExtension
      run: |
        bash ./gradlew jar --console=plain
        eco_jar="$PWD/build/libs/neoecoae-21.2.19.jar"
        test -f "$eco_jar"
        printf 'ORG_GRADLE_PROJECT_neoEcoCompileJar=%s\n' "$eco_jar" >> "$GITHUB_ENV"
