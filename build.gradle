publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
}

// JEI 只加入客户端 run 的 JVM classpath，数据生成 run 不加载它。
tasks.named('runClient', JavaExec) {
    classpath += configurations.jeiRuntime
}

// runData 与 runClient 共用 sourceSets.main.runtimeClasspath，而 JEI 在数据生成阶段
// 会因访问 Minecraft.getInstance() 而空指针，因此从数据生成任务的类路径中剔除 JEI。
tasks.named('runData', JavaExec) {
    classpath = classpath.filter { !it.name.startsWith('jei-') }
}

tasks.named('test', Test) {
    useJUnitPlatform()
    maxHeapSize = '2G'
    workingDir = layout.buildDirectory.dir('test-run').get().asFile
    doFirst { workingDir.mkdirs() }
}

// IDEA no longer automatically downloads sources/javadoc jars for dependencies, so we need to explicitly enable the behavior.
idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
