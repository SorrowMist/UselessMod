plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.107'
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    // Define wrapper values here so as to not have to always do so when updating gradlew.properties.
    // Switching this to Wrapper.DistributionType.ALL will download the full gradle sources that comes with
    // documentation attached on cursor hover of gradle classes and methods. However, this comes with increased
    // file size for Gradle. If you do switch this to ALL, run the Gradle wrapper task twice afterwards.
    // (Verify by checking gradle/wrapper/gradle-wrapper.properties to see if distributionUrl now points to `-all`)
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

repositories {
    maven {
        name = 'cursemaven'
        url = uri("https://www.cursemaven.com")
    }
    maven {
        name = "Modmaven"
        url = uri("https://modmaven.dev/")
    }
    maven {
        url = uri("https://maven.architectury.dev/")
    }
    maven {
        url = uri("https://maven.latvian.dev/releases/")
    }
    maven {
        name = "Modrinth"
        url = "https://api.modrinth.com/maven"
    }
    maven {
        name = "BlameJared"
        url = "https://maven.blamejared.com"
    }
    maven {
        name 'Thermal Maven'
        url 'https://maven.covers1624.net/'
    }
    maven {
        name = "TheIllusiveC4"
        url = "https://maven.theillusivec4.top/"
    }
    maven {
        name = "GeckoLib"
        url = "https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/"
    }
    maven {
        name = "FTB"
        url = "https://maven.ftb.dev/releases"
    }
    maven {
        name = "Kotlin for Forge"
        url = "https://thedarkcolour.github.io/KotlinForForge/"
    }
    maven {
        url = uri("https://jitpack.io")
    }
    // Astral Sorcery 及其硬前置 ObserverLib 仅在该仓库发布
    maven {
        name = "HellFirePvP Maven"
        url = "https://maven.hellfiredev.net/"
        content {
            includeGroup "hellfirepvp.observerlib"
            includeGroup "hellfirepvp.astralsorcery"
        }
    }
    mavenCentral()
}

base {
    archivesName = mod_id
}

// Mojang ships Java 21 to end users in 1.21.1, so mods should target Java 21.
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    // Specify the version of NeoForge to use.
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    accessTransformers = project.files('src/main/resources/META-INF/accesstransformer.cfg')

    // Default run configurations.
    // These can be tweaked, removed, or duplicated as needed.
    runs {
        client {
            client()
            gameDirectory = project.file('run/client')
            jvmArguments.addAll '-Xmx3G', '-Xms3G'
        }

        server {
            server()
            gameDirectory = project.file('run/server')
            programArgument '--nogui'
            jvmArguments.addAll '-Xmx3G', '-Xms3G'
        }

        data {
            data()

            // example of overriding the workingDirectory set in configureEach above, uncomment if you want to use it
            // gameDirectory = project.file('run-data')

            // Specify the modid for data generation, where to output the resulting resource, and where to look for existing resources.
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        // applies to all the run configs above
        configureEach {
            // Recommended logging data for a userdev environment
            // The markers can be added/remove as needed separated by commas.
            // "SCAN": For mods scan.
            // "REGISTRIES": For firing of registry events.
            // "REGISTRYDUMP": For getting the contents of all registries.
            systemProperty 'forge.logging.markers', 'REGISTRIES'

            // Recommended logging level for the console
            // You can set various levels here.
            // Please read: https://stackoverflow.com/questions/2031163/when-to-use-the-different-log-levels
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        // define mod <-> source bindings
        // these are used to tell the game which sources are for which mod
        // multi mod projects should define one per mod
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }

}

// Include resources generated by data generators.
sourceSets.main.resources { srcDir 'src/generated/resources' }

// ModDev adds Minecraft/NeoForge to main; JVM contract tests need those same classes.
sourceSets.test.compileClasspath += sourceSets.main.compileClasspath
sourceSets.test.runtimeClasspath += sourceSets.main.compileClasspath

configurations {
    runtimeClasspath.extendsFrom localRuntime
    // 仅用于把 JEI 追加到 runClient 的 JVM classpath，不参与 data run。
    jeiRuntime {
        canBeConsumed = false
        canBeResolved = true
    }
}

def productiveBeesApi = configurations.create('productiveBeesApi') {
    canBeConsumed = false
    canBeResolved = true
    transitive = false
}

def productiveLibJar = layout.buildDirectory.file(
        'generated/productivebees-api/productivelib-1.21.1-0.2.0.jar'
)
def extractProductiveLib = tasks.register('extractProductiveLib', Copy) {
    from { productiveBeesApi.collect { zipTree(it) } }
    include 'META-INF/jarjar/productivelib-1.21.1-0.2.0.jar'
    eachFile { details -> details.path = details.name }
    includeEmptyDirs = false
    into productiveLibJar.map { it.asFile.parentFile }
    doLast {
        if (!productiveLibJar.get().asFile.isFile()) {
            throw new GradleException('Productive Bees did not contain ProductiveLib 1.21.1-0.2.0')
        }
    }
}
def productiveLibCompileFiles = files(productiveLibJar).builtBy(extractProductiveLib)

// Ender IO ships EnderCore, GraphLib and the optional conduit module as Jar-in-Jar
// libraries.  NeoForge loads those libraries at runtime, but the nested jars are
// not exposed on the Java compile classpath by the Curse Maven artifact.
def enderIoApi = configurations.create('enderIoApi') {
    canBeConsumed = false
    canBeResolved = true
    transitive = false
}

def enderIoApiDirectory = layout.buildDirectory.dir('generated/enderio-api')
def extractEnderIoApi = tasks.register('extractEnderIoApi', Copy) {
    from { enderIoApi.collect { zipTree(it).matching { include 'META-INF/jarjar/*.jar' } } }
    eachFile { details -> details.path = details.name }
    includeEmptyDirs = false
    into enderIoApiDirectory
}
def enderIoCompileFiles = files(
        layout.buildDirectory.file('generated/enderio-api/com.enderio.endercore-8.2.11-beta.jar'),
        layout.buildDirectory.file('generated/enderio-api/GraphLib3-3.0.5.jar'),
        layout.buildDirectory.file('generated/enderio-api/com.enderio.enderio-modded-conduits-8.2.11-beta.jar')
).builtBy(extractEnderIoApi)

