        java.include 'com/sorrowmist/useless/compat/jei/AEKeyJeiIngredients.java'
        java.include 'com/sorrowmist/useless/compat/jei/WrappedKeyGuiHandler.java'
        java.include 'com/sorrowmist/useless/compat/appmek/AppMekJeiChemicalCompat.java'
        java.include 'com/sorrowmist/useless/client/gui/PressableAE2Button.java'
        java.include 'com/sorrowmist/useless/energy/IEnergyManager.java'
        java.include 'com/sorrowmist/useless/energy/EnergyManager.java'
        java.include 'com/sorrowmist/useless/init/ModTags.java'
        java.include 'com/sorrowmist/useless/world/inventory/ExternalInventorySavedData.java'
        java.include 'com/sorrowmist/useless/world/ae/AeConnectLinkSavedData.java'
        java.include 'com/sorrowmist/useless/core/component/**'
        java.include 'com/sorrowmist/useless/api/enums/tool/**'
        java.include 'com/sorrowmist/useless/content/recipe/AdapterUtils.java'
        java.include 'com/sorrowmist/useless/content/recipe/ExpectedOutputScaler.java'
        java.include 'com/sorrowmist/useless/content/recipe/adapters/create/**'
        java.include 'com/sorrowmist/useless/content/machines/advanced_alloy_furnace/chemical/ChemicalStackView.java'
