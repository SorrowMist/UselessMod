    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
    compileOnly 'io.github.llamalad7:mixinextras-common:0.5.0'
    annotationProcessor 'io.github.llamalad7:mixinextras-common:0.5.0'
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation 'org.mockito:mockito-core:5.15.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testRuntimeOnly 'org.slf4j:slf4j-api:2.0.9'
}
mixin {
    add sourceSets.main, "${mod_id}.refmap.json"
    ["${mod_id}.mixins.json", "${mod_id}.create.mixins.json", "${mod_id}.mekanism.mixins.json", "${mod_id}.jade.mixins.json", "${mod_id}.compact.mixins.json"].each { config it }
}
tasks.named('jar') {
    manifest.attributes('MixinConfigs': ["${mod_id}.mixins.json", "${mod_id}.create.mixins.json", "${mod_id}.mekanism.mixins.json", "${mod_id}.jade.mixins.json", "${mod_id}.compact.mixins.json"].join(','))
}
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs += ['-Xmaxerrs', '10000']
}
tasks.named('test', Test) {
    useJUnitPlatform()
    classpath = classpath.filter { !it.name.startsWith('slf4j-api-1.') }
}
tasks.named('processResources', ProcessResources) {
    inputs.property 'mod_version', mod_version
    filesMatching('META-INF/mods.toml') {
        expand mod_id: mod_id, mod_name: mod_name, mod_version: mod_version
    }
}

apply from: 'gradle/port-bridge-tests.gradle'

apply from: 'gradle/forge1201-pack-profile.gradle'

apply from: 'gradle/bytecode-contract-tests.gradle'
